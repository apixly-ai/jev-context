name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  bundles:
    uses: ./.github/workflows/native.yml
  release:
    needs: [bundles]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require a reviewed main-branch commit
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: npm-*
          path: dist
          merge-multiple: true
      - run: |
          sudo apt-get update && sudo apt-get install -y ripgrep
          python -m pip install --upgrade pip
          python -m pip install '.[code,dev]'
          python scripts/check_release.py "$GITHUB_REF_NAME"
          sh scripts/check.sh
          python -m pip_audit -f cyclonedx-json -o dist/dependencies.cdx.json
          python scripts/pack_npm.py
          python scripts/check_packages.py
          cd dist && sha256sum *.whl *.tar.gz *.tgz dependencies.cdx.json > SHA256SUMS
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: 'dist/*'
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
