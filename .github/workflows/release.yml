name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: |
          sudo apt-get update && sudo apt-get install -y ripgrep
          python -m pip install --upgrade pip
          python -m pip install '.[code,dev]'
          python scripts/check_release.py "$GITHUB_REF_NAME"
          sh scripts/check.sh
          python -m pip_audit -f cyclonedx-json -o dist/dependencies.cdx.json
          cd dist && sha256sum *.whl *.tar.gz dependencies.cdx.json > SHA256SUMS
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: 'dist/*'
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
