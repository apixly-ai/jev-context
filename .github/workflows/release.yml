name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  bundles:
    uses: ./.github/workflows/native.yml
  release:
    needs: [bundles]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: npm-*
          path: dist
          merge-multiple: true
      - run: |
          sudo apt-get update && sudo apt-get install -y ripgrep
          python -m pip install --upgrade pip
          python -m pip install '.[code,dev]'
          python scripts/check_release.py "$GITHUB_REF_NAME"
          sh scripts/check.sh
          python -m pip_audit -f cyclonedx-json -o dist/dependencies.cdx.json
          npm pack --ignore-scripts --pack-destination dist
          cd dist && sha256sum *.whl *.tar.gz *.tgz dependencies.cdx.json > SHA256SUMS
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: 'dist/*'
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
