name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        os: [ubuntu-latest]
        include:
          - python: '3.13'
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y ripgrep; else brew list ripgrep || brew install ripgrep; fi
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[code,dev]'
      - run: sh scripts/check.sh
      - run: |
          python -m venv /tmp/jev-wheel
          /tmp/jev-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/jev-wheel/bin/jev-filter --version
          /tmp/jev-wheel/bin/jev-filter doctor
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev,browser-test]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/test_browser.py tests/test_dashboard_browser.py
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm test
      - run: npm pack --dry-run --ignore-scripts
  ci:
    if: always()
    needs: [test, browser, npm]
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.test.result }}' = success && test '${{ needs.browser.result }}' = success && test '${{ needs.npm.result }}' = success
