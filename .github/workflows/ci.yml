name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        os: [ubuntu-latest]
        include:
          - python: '3.13'
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y ripgrep; else brew list ripgrep || brew install ripgrep; fi
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[code,dev]'
      - run: sh scripts/check.sh
      - run: |
          python -m venv /tmp/jev-wheel
          /tmp/jev-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/jev-wheel/bin/jev-context --version
          /tmp/jev-wheel/bin/jev-context doctor
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev,browser-test]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/test_browser.py
  ci:
    if: always()
    needs: [test, browser]
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.test.result }}' = success && test '${{ needs.browser.result }}' = success
