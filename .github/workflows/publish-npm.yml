name: Publish npm
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    if: vars.NPM_TRUSTED_PUBLISHING == 'true'
    environment: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Download and verify released npm package
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) exit 1 ;; esac
          mkdir artifacts
          gh release download "$TAG" --pattern '*.tgz' --pattern SHA256SUMS --dir artifacts
          cd artifacts
          sha256sum --check --ignore-missing SHA256SUMS
          gh attestation verify "apixly-jev-context-${TAG#v}.tgz" --repo "$GITHUB_REPOSITORY"
      - name: Publish through configured npm trusted publisher
        env:
          TAG: ${{ inputs.tag }}
        run: |
          for package in artifacts/apixly-jev-context-darwin-*.tgz artifacts/apixly-jev-context-linux-*.tgz; do
            npm publish "$package" --access public --provenance
          done
          npm publish "artifacts/apixly-jev-context-${TAG#v}.tgz" --access public --provenance
