[build-system]
requires = ["hatchling==1.32.3"]
build-backend = "hatchling.build"

[project]
name = "jev-context"
version = "0.1.0rc1"
description = "Evidence-preserving semantic tools for AI agents, powered by Jev"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "JIA-ss"}]
keywords = ["agents", "jev", "context", "cli", "semantic-search"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Operating System :: POSIX :: Linux", "Operating System :: MacOS", "Topic :: Software Development :: Libraries"]
dependencies = ["httpx>=0.28.1,<0.29"]

[project.optional-dependencies]
code = ["tree-sitter>=0.25.2,<0.27", "tree-sitter-javascript>=0.25,<0.26", "tree-sitter-typescript>=0.23.2,<0.24", "tree-sitter-go>=0.25,<0.26"]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "build>=1.2,<2", "twine>=6,<7", "pip-audit>=2.8,<3", "jsonschema>=4.23,<5", "pyyaml>=6,<7"]
browser-test = ["playwright>=1.51,<2"]

[project.scripts]
jev-context = "jev_context.cli:entrypoint"

[project.urls]
Homepage = "https://github.com/JIA-ss/jev-context"
Documentation = "https://github.com/JIA-ss/jev-context/tree/main/docs"
Issues = "https://github.com/JIA-ss/jev-context/issues"
Changelog = "https://github.com/JIA-ss/jev-context/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_context"]
[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "skills", "benchmarks", "schemas", "scripts", "pyproject.toml", "README.md", "README.zh-CN.md", "LICENSE", "NOTICE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["browser: local browser tests, no external account"]

[tool.coverage.run]
source = ["jev_context"]
[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
target-version = "py310"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
